[workspace]
members = [
    "crates/library",
    "crates/database",
    "crates/exp-hko-local-maximum",
    "crates/exp-sys-landscape",
    "crates/dev-algorithm-comparison",
    "crates/dev-numerical-analysis",
    "crates/dev-capacity-validation",
    "crates/dev-gradient",
    "crates/dev-gradient-ascent",
    "crates/crosspolytope",
    "crates/visualization",
]
resolver = "2"

[workspace.dependencies]
symplectic = { path = "crates/library" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
blake3 = "1"
num-traits = "0.2"
num-integer = "0.1"
tempfile = "3"
wait-timeout = "0.2"
good_lp = { version = "1.15", default-features = false, features = ["clarabel"] }
proptest = "1"
rstest = "0.23"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Relaxed lints for experiment crates — keeps correctness and suspicious,
# suppresses style/complexity/perf noise that buries real issues.
# Library does NOT inherit these (stays strict via `cargo clippy --lib -- -D warnings`).
[workspace.lints.clippy]
style = "allow"
complexity = "allow"
perf = "allow"
[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"

[profile.release]
debug = true

# Optimize nalgebra in dev/test builds — linear algebra is ~50x slower unoptimized.
[profile.dev.package.nalgebra]
opt-level = 3
[profile.test.package.nalgebra]
opt-level = 3

# Optimize rational arithmetic in dev/test builds — BigRational is ~20x slower
# unoptimized due to heap-allocated big integers (same pattern as nalgebra above).
[profile.dev.package.num-bigint]
opt-level = 3
[profile.test.package.num-bigint]
opt-level = 3
[profile.dev.package.num-rational]
opt-level = 3
[profile.test.package.num-rational]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.test.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.test.package.num-traits]
opt-level = 3
