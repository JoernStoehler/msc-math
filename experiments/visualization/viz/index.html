<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Polytope Visualization — Stereographic Projection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Mono', monospace;
            font-size: 16px;
            background: #ffffff;
            color: #24292f;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
        }

        /* Control panel */
        #controls {
            position: fixed;
            top: 12px; left: 12px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 16px;
            width: 300px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            z-index: 10;
            font-size: 14px;
        }
        #controls h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #0550ae;
            font-weight: 600;
        }
        #controls label {
            display: block;
            margin: 8px 0 4px;
            color: #57606a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        #controls select, #controls button {
            width: 100%;
            padding: 6px 10px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            color: #24292f;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        #controls select:hover, #controls button:hover {
            border-color: #0550ae;
        }
        #controls button {
            margin: 3px 0;
        }

        .slider-group {
            margin: 6px 0;
        }
        .slider-group input[type="range"] {
            width: 100%;
            margin: 2px 0;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
        }
        .toggle-row input[type="checkbox"] {
            accent-color: #0550ae;
        }
        .toggle-row span {
            color: #24292f;
            font-size: 14px;
        }

        .section {
            border-top: 1px solid #d8dee4;
            margin-top: 10px;
            padding-top: 8px;
        }

        #pole-display {
            color: #1a7f37;
            font-size: 13px;
            margin: 4px 0 8px;
            font-weight: 500;
        }

        .preset-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .preset-row button {
            width: auto;
            flex: 1;
            min-width: 45px;
            padding: 4px 8px;
            font-size: 12px;
        }

        /* Info panel */
        #info {
            position: fixed;
            top: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 16px;
            width: 280px;
            z-index: 10;
        }
        #info pre {
            font-family: inherit;
            font-size: 13px;
            white-space: pre-wrap;
            color: #57606a;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Trajectory info */
        #traj-label {
            color: #8250df;
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h3>4D Polytope Viz</h3>

        <label for="polytope-select">Polytope</label>
        <select id="polytope-select" onchange="onPolytopeChange(this.value)">
            <option value="simplex">4-Simplex (5F)</option>
            <option value="hypercube" selected>Hypercube [-1,1]⁴ (8F)</option>
            <option value="crosspolytope">Cross-polytope (16F)</option>
            <option value="hko_pentagon">HK-O Pentagon (10F)</option>
            <option value="lagrangian_triangle_product">Lag. △×△ (6F)</option>
            <option value="symplectic_triangle_product">Symp. △×△ (6F)</option>
            <option value="lagrangian_tri_sq">Lag. △×□ (7F)</option>
            <option value="symplectic_tri_sq">Symp. △×□ (7F)</option>
        </select>

        <div class="section">
            <label for="north-pole-input">North Pole</label>
            <input type="text" id="north-pole-input"
                   placeholder="x, y, z, w"
                   value="0, 0, 0, 1"
                   onchange="setNorthPoleFromText(this.value)"
                   style="width: 100%; padding: 6px 10px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px; font-family: inherit; font-size: 14px;">
            <div id="pole-display" style="margin-top: 4px;">(0.00, 0.00, 0.00, 1.00)</div>

            <label style="margin-top: 8px;">Presets</label>
            <div class="preset-row">
                <button onclick="setNorthPolePreset('e4')">e₄</button>
                <button onclick="setNorthPolePreset('e3')">e₃</button>
                <button onclick="setNorthPolePreset('e1')">e₁</button>
                <button onclick="setNorthPolePreset('diagonal')">diag</button>
            </div>
            <div class="preset-row">
                <button onclick="setNorthPolePreset('vertex0')">vertex₀</button>
                <button onclick="setNorthPolePreset('normal0')">normal₀</button>
            </div>
        </div>

        <div class="section">
            <label for="show-vertices">Display</label>
            <div class="toggle-row">
                <input type="checkbox" id="show-vertices" checked
                       onchange="onToggle('vertices', this.checked)">
                <span>Vertices</span>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="show-edges" checked
                       onchange="onToggle('edges', this.checked)">
                <span>Edges</span>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="show-ridges"
                       onchange="onToggle('ridges', this.checked)">
                <span>Ridges (2-faces)</span>
            </div>
        </div>

        <div class="section">
            <label>Reeb Trajectories</label>
            <div style="margin-bottom: 4px;">
                <button onclick="toggleAllTrajectories(true)" style="font-size: 11px; padding: 1px 6px;">All</button>
                <button onclick="toggleAllTrajectories(false)" style="font-size: 11px; padding: 1px 6px;">None</button>
            </div>
            <div id="trajectory-checkboxes"></div>
        </div>

        <div class="section">
            <button onclick="resetCamera()">Reset Camera</button>
        </div>
    </div>

    <div id="info">
        <pre id="info-text">Loading...</pre>
    </div>

    <!-- Three.js (r128 is the last version with global UMD build on cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for r128 (global build) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Our modules -->
    <script src="projection.js"></script>
    <script src="data.js"></script>
    <script src="viz.js"></script>

    <script>
        init();
        loadPolytope('hypercube');
    </script>
</body>
</html>
