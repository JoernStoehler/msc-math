[package]
name = "exp-dev-quadratic-program"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "f64-capacity-scan"
path = "tools/scan/main.rs"

[[bin]]
name = "f64-capacity-analyze"
path = "tools/analyze/main.rs"

[[bin]]
name = "f64-capacity-near-singular"
path = "numerics/near_singular/main.rs"

[[bin]]
name = "f64-capacity-benchmark"
path = "performance/benchmark/main.rs"

[[bin]]
name = "f64-capacity-e2e"
path = "performance/f64_capacity_e2e.rs"

[[bin]]
name = "f64-decision-compare"
path = "performance/f64_decision_compare.rs"

[[bin]]
name = "qp-kkt-error-audit"
path = "tools/kkt_error_audit/main.rs"

[[bin]]
name = "qp-candidate-filter-audit"
path = "tools/candidate_filter_audit/main.rs"

[[bin]]
name = "qp-general-algorithm-ablation"
