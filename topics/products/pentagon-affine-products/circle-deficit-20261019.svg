<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">An interior vertex forces a circle deficit</title>
<desc id="desc">An obtuse triangle lies in the circle on its longest side. Its diameter endpoints have distance r from the centre, while its third vertex has distance d less than r. Pairing the vertices with closed partner steps of total length S and minimum length m bounds twice the coefficient modulus by r S minus m times r minus d.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
 <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#192b3d} .small{font-size:16px}.body{font-size:19px}.math{font-family:DejaVu Serif,serif;font-size:23px}.label{font-family:DejaVu Serif,serif;font-size:20px}</style>
</defs>
<rect width="1000" height="550" rx="12" fill="#ffffff"/>
<text x="42" y="44" font-size="27" font-weight="600">An interior vertex forces a loss</text>
<text x="42" y="75" class="body" fill="#526277">Closure removes the centre; a positive weight makes the unused radius count.</text>
<text x="54" y="115" class="small" font-weight="600">POINT TRIANGLE</text>
<circle cx="245" cy="265" r="130" fill="#f0f5fa" stroke="#91a7bd" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M115 265 L375 265 L215 180 Z" fill="#ffe5b7" stroke="#c57b14" stroke-width="2.5"/>
<line x1="245" y1="265" x2="201.7" y2="142.4" stroke="#7a5596" stroke-width="1.6" stroke-dasharray="3 4"/>
<line x1="215" y1="180" x2="201.7" y2="142.4" stroke="#8351a0" stroke-width="5"/>
<line x1="245" y1="265" x2="215" y2="180" stroke="#207a87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="221" class="label" fill="#207a87">d</text>
<line x1="245" y1="265" x2="375" y2="265" stroke="#1d4d78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307" y="289" class="label">r</text>
<circle cx="245" cy="265" r="4" fill="#192b3d"/>
<text x="239" y="290" class="label">c</text>
<circle cx="115" cy="265" r="4" fill="#c57b14"/><circle cx="375" cy="265" r="4" fill="#c57b14"/><circle cx="215" cy="180" r="4" fill="#c57b14"/>
<text x="90" y="252" class="label">p₁</text><text x="383" y="270" class="label">p₂</text><text x="224" y="171" class="label">p₃</text>
<path d="M195 159 L156 144 L104 144" fill="none" stroke="#8351a0" stroke-width="1.5"/>
<text x="54" y="135" class="small" fill="#8351a0">unused radius r − d</text>
<line x1="115" y1="326" x2="375" y2="326" stroke="#526277" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="215" y="351" class="label">ℓ = 2r</text>
<text x="70" y="420" class="body">Two vertices reach radius r.</text>
<text x="70" y="449" class="body">The third reaches only d &lt; r.</text>
<line x1="470" y1="115" x2="470" y2="465" stroke="#dae2eb"/>
<text x="515" y="115" class="small" font-weight="600">CLOSED PARTNER STEPS</text>
<path d="M560 154 L710 154" fill="none" stroke="#247c9b" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M710 154 L650 214" fill="none" stroke="#247c9b" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M650 214 L560 154" fill="none" stroke="#247c9b" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="620" y="144" class="label">y₁</text><text x="705" y="196" class="label">y₂</text><text x="580" y="208" class="label">y₃</text>
<text x="758" y="155" class="body">Σ yᵢ = 0</text><text x="758" y="188" class="body">wᵢ = |yᵢ|</text><text x="758" y="221" class="body">S = Σ wᵢ</text>
<rect x="511" y="253" width="447" height="168" rx="9" fill="#f2f7f8"/>
<text x="531" y="289" class="math">2|z| ≤ r(w₁ + w₂) + dw₃</text>
<text x="591" y="331" class="math">= rS − w₃(r − d)</text>
<text x="591" y="373" class="math" font-weight="600">≤ rS − m(r − d)</text>
<text x="532" y="403" class="small">m = min wᵢ &gt; 0, so w₃ ≥ m.</text>
<text x="515" y="450" class="body">Crude circle bound: 2|z| ≤ rS.</text>
<text x="515" y="480" class="body" font-weight="600" fill="#8351a0">Guaranteed loss: m(r − d).</text>
<line x1="42" y1="502" x2="958" y2="502" stroke="#dae2eb"/>
<text x="42" y="530" class="small">Illustration of the circle estimate only. Right triangle: d = r and this loss vanishes.</text>
</svg>
