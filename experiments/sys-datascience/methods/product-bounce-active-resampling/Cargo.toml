[workspace]

[package]
name = "product-bounce-active-resampling"
version = "0.1.0"
edition = "2021"

[dependencies]
exp-sys-landscape = { path = "../../../../experiments/sys-landscape" }
euclidean-polytopes = { path = "../../../../crates/euclidean-polytopes" }
nalgebra = "0.33"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symplectic = { path = "../../../../crates/symplectic" }

[[bin]]
name = "product-bounce-active-resampling"
path = "src/main.rs"

[[bin]]
name = "product-bounce-active-match-features"
path = "src/bin/match_features.rs"
