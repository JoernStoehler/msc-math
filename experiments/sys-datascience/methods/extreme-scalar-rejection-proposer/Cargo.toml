[workspace]

[package]
name = "extreme-scalar-rejection-proposer"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
blake3 = "1"
euclidean-polytopes = { path = "../../../../crates/euclidean-polytopes" }
exp-sys-landscape = { path = "../../../sys-landscape" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-rational = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symplectic = { path = "../../../../crates/symplectic" }
