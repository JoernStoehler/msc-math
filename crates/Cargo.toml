[package]
name = "symplectic"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
tempfile = "3"
wait-timeout = "0.2"
good_lp = { version = "1.15", default-features = false, features = ["clarabel"] }
num-integer = "0.1"

[dev-dependencies]
proptest = "1"
rstest = "0.23"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "profiling"
harness = false

[profile.release]
debug = true

# Optimize nalgebra in dev/test builds — linear algebra is ~50x slower unoptimized.
[profile.dev.package.nalgebra]
opt-level = 3

[profile.test.package.nalgebra]
opt-level = 3

# Optimize rational arithmetic in dev/test builds — BigRational is ~20x slower
# unoptimized due to heap-allocated big integers (same pattern as nalgebra above).
[profile.dev.package.num-bigint]
opt-level = 3

[profile.test.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

[profile.test.package.num-rational]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

[profile.test.package.num-integer]
opt-level = 3

[profile.dev.package.num-traits]
opt-level = 3

[profile.test.package.num-traits]
opt-level = 3
