[workspace]
members = [
    "crates/symplectic",
    "crates/algebraic-numbers",
    "crates/euclidean-polytopes",
    "experiments/dev-gradient-ascent",
    "experiments/hko-local-maximum",
    "experiments/regular-products",
    "experiments/sys-landscape",
    "experiments/combinatorial-cells",
    "experiments/dev-flow-graph",
    "experiments/dev-quadratic-program",
    "experiments/verification",
    "experiments/dev-quadratic-program/numerics-audit",
    "experiments/qp-error-bounds",
    "experiments/performance",
    "experiments/crosspolytope",
    "experiments/dev-sys-prediction",
    "experiments/visualization",
    "experiments/dev-canonization-t-search",
]
resolver = "2"

[workspace.dependencies]
symplectic = { path = "crates/symplectic" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
blake3 = "1"
num-traits = "0.2"
num-integer = "0.1"
tempfile = "3"
wait-timeout = "0.2"
good_lp = { version = "1.15", default-features = false, features = ["clarabel"] }
algebraic-numbers = { path = "crates/algebraic-numbers" }
euclidean-polytopes = { path = "crates/euclidean-polytopes" }
proptest = "1"
rstest = "0.23"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
style = "allow"
complexity = "allow"
perf = "allow"

[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"

[profile.release]
debug = true

[profile.dev.package.nalgebra]
opt-level = 3

[profile.test.package.nalgebra]
opt-level = 3

[profile.dev.package.num-bigint]
opt-level = 3

[profile.test.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

[profile.test.package.num-rational]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

[profile.test.package.num-integer]
opt-level = 3

[profile.dev.package.num-traits]
opt-level = 3

[profile.test.package.num-traits]
opt-level = 3
