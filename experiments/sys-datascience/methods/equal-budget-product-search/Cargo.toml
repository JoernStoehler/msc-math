[workspace]

[package]
name = "equal-budget-product-search"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "equal-budget-product-search"
path = "src/main.rs"

[dependencies]
exp-sys-landscape = { path = "../../../sys-landscape" }
symplectic = { path = "../../../../crates/symplectic" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"

[profile.release]
debug = 1
