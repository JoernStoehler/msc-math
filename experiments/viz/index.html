<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Polytope Visualization — Stereographic Projection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Mono', monospace;
            background: #ffffff;
            color: #24292f;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
        }

        /* Control panel */
        #controls {
            position: fixed;
            top: 12px; left: 12px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 14px;
            width: 280px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            z-index: 10;
            font-size: 12px;
        }
        #controls h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #0550ae;
        }
        #controls label {
            display: block;
            margin: 6px 0 2px;
            color: #57606a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #controls select, #controls button {
            width: 100%;
            padding: 5px 8px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            color: #24292f;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        #controls select:hover, #controls button:hover {
            border-color: #0550ae;
        }
        #controls button {
            margin: 3px 0;
        }

        .slider-group {
            margin: 6px 0;
        }
        .slider-group input[type="range"] {
            width: 100%;
            margin: 2px 0;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
        }
        .toggle-row input[type="checkbox"] {
            accent-color: #0550ae;
        }
        .toggle-row span {
            color: #24292f;
            font-size: 12px;
        }

        .section {
            border-top: 1px solid #d8dee4;
            margin-top: 10px;
            padding-top: 8px;
        }

        #pole-display {
            color: #1a7f37;
            font-size: 11px;
            margin: 2px 0 6px;
        }

        .preset-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .preset-row button {
            width: auto;
            flex: 1;
            min-width: 40px;
            padding: 3px 6px;
            font-size: 10px;
        }

        /* Info panel */
        #info {
            position: fixed;
            top: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 14px;
            width: 220px;
            z-index: 10;
        }
        #info pre {
            font-family: inherit;
            font-size: 11px;
            white-space: pre-wrap;
            color: #57606a;
            line-height: 1.5;
        }

        /* Trajectory info */
        #traj-label {
            color: #8250df;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h3>4D Polytope Viz</h3>

        <label>Polytope</label>
        <select id="polytope-select" onchange="onPolytopeChange(this.value)">
            <option value="simplex">4-Simplex (5F)</option>
            <option value="hypercube" selected>Hypercube [-1,1]⁴ (8F)</option>
            <option value="crosspolytope">Cross-polytope (16F)</option>
            <option value="hko_pentagon">HK-O Pentagon (10F)</option>
            <option value="lagrangian_triangle_product">Lag. △×△ (6F)</option>
            <option value="symplectic_triangle_product">Symp. △×△ (6F)</option>
            <option value="lagrangian_tri_sq">Lag. △×□ (7F)</option>
            <option value="symplectic_tri_sq">Symp. △×□ (7F)</option>
        </select>

        <div class="section">
            <label>North Pole</label>
            <div id="pole-display">(0.00, 0.00, 0.00, 1.00)</div>

            <label>Presets</label>
            <div class="preset-row">
                <button onclick="setNorthPolePreset('e4')">e₄</button>
                <button onclick="setNorthPolePreset('e3')">e₃</button>
                <button onclick="setNorthPolePreset('e1')">e₁</button>
                <button onclick="setNorthPolePreset('diagonal')">diag</button>
            </div>
            <div class="preset-row">
                <button onclick="setNorthPolePreset('vertex0')">vertex₀</button>
                <button onclick="setNorthPolePreset('normal0')">normal₀</button>
            </div>

            <div class="slider-group">
                <label>φ (polar)</label>
                <input type="range" id="north-phi" min="0" max="3.14159" step="0.02"
                       value="0" oninput="updateNorthPole()">
            </div>
            <div class="slider-group">
                <label>θ (azimuth)</label>
                <input type="range" id="north-theta" min="0" max="6.28318" step="0.02"
                       value="0" oninput="updateNorthPole()">
            </div>
            <div class="slider-group">
                <label>ψ (S³ rotation)</label>
                <input type="range" id="north-psi" min="0" max="3.14159" step="0.02"
                       value="0" oninput="updateNorthPole()">
            </div>
        </div>

        <div class="section">
            <label>Display</label>
            <div class="toggle-row">
                <input type="checkbox" id="show-vertices" checked
                       onchange="onToggle('vertices', this.checked)">
                <span>Vertices</span>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="show-edges" checked
                       onchange="onToggle('edges', this.checked)">
                <span>Edges</span>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="show-ridges"
                       onchange="onToggle('ridges', this.checked)">
                <span>Ridges (2-faces)</span>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="show-traj" checked
                       onchange="onToggle('trajectories', this.checked)">
                <span>Reeb trajectories</span>
            </div>
        </div>

        <div class="section">
            <label>Trajectory</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button onclick="onTrajectoryChange(-1)" style="width: auto; padding: 3px 8px;">All</button>
                <input type="range" id="traj-index" min="0" max="0" value="0"
                       style="flex: 1;"
                       oninput="onTrajectoryChange(parseInt(this.value))">
            </div>
            <div id="traj-label">all</div>
        </div>

        <div class="section">
            <button onclick="resetCamera()">Reset Camera</button>
        </div>
    </div>

    <div id="info">
        <pre id="info-text">Loading...</pre>
    </div>

    <!-- Three.js (r128 is the last version with global UMD build on cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for r128 (global build) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Our modules -->
    <script src="projection.js"></script>
    <script src="viz.js"></script>

    <script>
        init();
        loadPolytope('hypercube');
    </script>
</body>
</html>
