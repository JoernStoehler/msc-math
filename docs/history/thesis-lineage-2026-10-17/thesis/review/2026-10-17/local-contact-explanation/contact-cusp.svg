<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" role="img" aria-labelledby="title desc">
<title id="title">Competing contact branches create a cusp</title>
<desc id="desc">The linearized logarithmic loss is the maximum of two lines, with slopes plus and minus two square root five over five. It increases for either sign of this shape change. This is a first-order model, not measured ratios.</desc>
<rect width="700" height="510" fill="white"/>
<g font-family="sans-serif" fill="#18212b">
<text x="350" y="31" text-anchor="middle" font-size="21">Competing contacts create a cusp</text>
<text x="350" y="58" text-anchor="middle" font-size="14">First-order logarithmic loss along one explicit shape change</text>
<line x1="71" y1="300" x2="629" y2="300" stroke="#707b86"/>
<line x1="350" y1="421.5" x2="350" y2="111" stroke="#707b86"/>
<text x="80" y="322" text-anchor="middle" font-size="12">-0.03</text>
<text x="170" y="322" text-anchor="middle" font-size="12">-0.02</text>
<text x="260" y="322" text-anchor="middle" font-size="12">-0.01</text>
<text x="440" y="322" text-anchor="middle" font-size="12">0.01</text>
<text x="530" y="322" text-anchor="middle" font-size="12">0.02</text>
<text x="620" y="322" text-anchor="middle" font-size="12">0.03</text>
<text x="340" y="394" text-anchor="end" font-size="12">-0.02</text>
<text x="340" y="214" text-anchor="end" font-size="12">0.02</text>
<text x="340" y="124" text-anchor="end" font-size="12">0.04</text>
<line x1="80" y1="420.748" x2="620" y2="179.252" stroke="#3b82a0" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="80" y1="179.252" x2="620" y2="420.748" stroke="#c87824" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="80" y1="179.252" x2="350" y2="300" stroke="#702e91" stroke-width="4"/>
<line x1="350" y1="300" x2="620" y2="179.252" stroke="#702e91" stroke-width="4"/>
<text x="425" y="146" font-size="16" fill="#702e91">D(tδ) = (2√5/5)|t|</text>
<text x="640" y="288" font-size="14">t</text>
<text x="40" y="445" font-size="14">Shape change: δa₀ = a₀, δa₁ = −a₁; all other normal changes zero.</text>
<text x="40" y="472" font-size="14">log(ρH / sys(z₀ + tδ)) = D(tδ) + O(t²).</text>
<text x="40" y="495" font-size="12" fill="#56616e">Dashed: two active linear forms. Purple: their maximum. Model only; no fitted values.</text>
</g></svg>
