[package]
name = "generic-ridge-tail-stage1-target"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
blake3 = "1"
euclidean-polytopes = { path = "../../../../crates/euclidean-polytopes" }
exp-sys-landscape = { path = "../../../sys-landscape" }
libc = "0.2"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symplectic = { path = "../../../../crates/symplectic" }

[profile.release]
debug = true
