[workspace]

[package]
name = "adaptive-multilevel-splitting"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
equal-budget-product-search = { path = "../equal-budget-product-search" }
exp-sys-landscape = { path = "../../../sys-landscape" }
blake3 = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
