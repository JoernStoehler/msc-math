# api-extract: extracts public API documentation from crates/library/src/ and writes
# markdown reference files to api-reference/library/src/.
#
# Inputs:  crates/library/src/**/*.rs
# Outputs: api-reference/library/src/**/*.md + api-reference/library/src/lib.md (index)
#
# Run from workspace root: cargo run -p api-extract --release

[package]
name = "api-extract"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api-extract"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = "1"
quote = "1"
walkdir = "2"
