[workspace]

[package]
name = "paired-tangentialization"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
symplectic = { path = "../../../../crates/symplectic" }
euclidean-polytopes = { path = "../../../../crates/euclidean-polytopes" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
