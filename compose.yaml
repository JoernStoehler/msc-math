# Runtime declaration; design rationale and ownership map: container/README.md
name: msc-math

services:
  workspace:
    image: msc-math-workspace:local
    platform: linux/amd64
    pull_policy: never
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        DEVELOPER_UID: "${DEVELOPER_UID:?set DEVELOPER_UID in .env}"
        DEVELOPER_GID: "${DEVELOPER_GID:?set DEVELOPER_GID in .env}"
        CODEX_VERSION: "${CODEX_VERSION:?set CODEX_VERSION in .env}"

    init: true
    tty: true
    stdin_open: true
    restart: "no"
    stop_grace_period: 30s
    command: ["sleep", "infinity"]
    working_dir: /workspaces/msc-math

    environment:
      HOME: /home/developer
      USER: developer
      LOGNAME: developer
      CODEX_HOME: /home/developer/.codex
      CARGO_HOME: /home/developer/.cargo
      RUSTUP_HOME: /opt/rustup
      UV_CACHE_DIR: /home/developer/.cache/uv
      NPM_CONFIG_CACHE: /home/developer/.cache/npm
      NPM_CONFIG_PREFIX: /home/developer/.local
      XDG_RUNTIME_DIR: "/run/user/${DEVELOPER_UID:?set DEVELOPER_UID in .env}"
      CARGO_BUILD_JOBS: "4"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: Europe/Berlin
      TERM: xterm-256color

    volumes:
      - type: bind
        source: ..
        target: /workspaces
        bind:
          propagation: rprivate
          create_host_path: false
      - type: bind
        source: "${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env}"
        target: /home/developer/.codex
        bind:
          propagation: rprivate
          create_host_path: false
      - type: bind
        source: "${GH_HOME_HOST:?set GH_HOME_HOST in .env}"
        target: /home/developer/.config/gh
        bind:
          propagation: rprivate
          create_host_path: false
      - type: bind
        source: "${DATA_HOME_HOST:?set DATA_HOME_HOST in .env}"
        target: /data
        bind:
          propagation: rprivate
          create_host_path: false

    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=4g,mode=1777
      - /var/tmp:rw,nosuid,nodev,exec,size=1g,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=64m,mode=0755
      - "/run/user/${DEVELOPER_UID:?set DEVELOPER_UID in .env}:rw,nosuid,nodev,noexec,size=64m,uid=${DEVELOPER_UID:?set DEVELOPER_UID in .env},gid=${DEVELOPER_GID:?set DEVELOPER_GID in .env},mode=0700"

    mem_limit: 10g
    memswap_limit: 10g
    pids_limit: 16384

    ports:
      - "127.0.0.1:4500:4500"

    networks:
      default: {}
      dev:
        aliases:
          - msc-math

networks:
  default: {}
  dev:
    name: joern-dev
    external: true
