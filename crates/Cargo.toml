[package]
name = "symplectic"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
tempfile = "3"
wait-timeout = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
debug = true

# Optimize nalgebra in dev/test builds — linear algebra is ~50x slower unoptimized.
[profile.dev.package.nalgebra]
opt-level = 3

[profile.test.package.nalgebra]
opt-level = 3
